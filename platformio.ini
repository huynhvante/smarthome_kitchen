
[env]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = 
	-DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps = 
	markruys/DHT@^1.0.0
    bblanchon/ArduinoJson@^6.21.0
	adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9


; ; Nạp bằng USB
; [env:Kitchen-usb]
; upload_port = COM10

; Nạp qua OTA
; C:\Users\ASUS\.platformio\penv\Scripts\platformio.exe run -e Kitchen-ota -t upload
[env:Kitchen-ota]
upload_protocol = espota
upload_port = 10.199.114.116
; upload_port = kitchen-node.local
upload_flags =
    --auth=Kitchen@k18